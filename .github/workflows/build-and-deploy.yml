name: Build JSON from RDF and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/*.rdf'
      - 'data/*.ttl'
      - 'scripts/rdf_to_json.py'
      - 'dashboard.html'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install rdflib
        run: pip install rdflib

      - name: Generate JSON from RDF
        run: python scripts/rdf_to_json.py

      - name: Sync dashboard.html to docs/
        run: cp dashboard.html docs/dashboard.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Auto-generate JSON from RDF and sync dashboard [skip ci]"
          git push
